[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "duck-counter"
version = "1.0.0"
description = "Modular Duck Detection and Counting Pipeline using YOLO"
authors = [{ name = "DataNLP Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.3.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "opencv-python>=4.8.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    "requests>=2.28.0",
    "pyyaml>=6.0",
    "pillow>=10.0.0"
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.20.0",
    "notebook>=6.5.0",
    "jupyterlab>=4.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
